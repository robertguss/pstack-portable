# Daily: convert upstream pstack, thermos and cursor-team-kit main into a
# scratch project. A failed run (GitHub emails you) means upstream changed in a
# way the converter or defaults.json needs updating for. Nothing is committed;
# the plugins are fetched fresh by each project's own `--latest` sync.
name: Upstream check

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Sync upstream main into a scratch project
        shell: bash # explicit shell adds pipefail, so a crash before tee still fails
        run: |
          ref=$(git ls-remote https://github.com/cursor/plugins HEAD | cut -f1)
          echo "UPSTREAM_REF=$ref" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/project"
          for plugin in pstack thermos cursor-team-kit; do
            node bin/pstack-sync.mjs --plugin "$plugin" --ref "$ref" --dir "$RUNNER_TEMP/project" | tee -a "$RUNNER_TEMP/out.txt"
          done
          if grep -q '^warning:' "$RUNNER_TEMP/out.txt"; then
            echo "::error::Upstream sync produced warnings; see above."
            exit 1
          fi
      - name: Check overrides still match the upstream files they replaced
        shell: bash
        run: |
          ref=$UPSTREAM_REF
          stale=0
          while read -r file base want; do
            got=$(curl -fsSL "https://raw.githubusercontent.com/cursor/plugins/$ref/$file" | sha256sum | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              echo "::error file=overrides/$file::Upstream changed $file. Port it into the override, then update overrides/upstream.json. Changes: https://github.com/cursor/plugins/compare/$base...$ref"
              stale=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.ref) \(.value.sha256)"' overrides/upstream.json)
          exit $stale
